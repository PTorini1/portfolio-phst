<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio profissional e blog tecnico de Pedro Torini, desenvolvedor .NET/backend."
    />
    <title>Pedro Torini | Portfolio</title>
    <!--
      Script inline para aplicar o tema antes do primeiro render React,
      evitando o flash perceptível de tema (FOUC).
      Lê a preferência do localStorage ou do prefers-color-scheme do sistema.
    -->
    <script>
      (function () {
        var stored = localStorage.getItem("portfolio-theme");
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
